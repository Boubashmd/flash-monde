name: Video Flash Monde

# Traite les videos envoyees au bot Telegram (lance par « Veille video », ou a la main).
on:
  workflow_dispatch:

permissions:
  contents: write

# une seule edition a la fois (les fichiers de data/ sont partages)
concurrency:
  group: flash-monde
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_MODELE: ${{ vars.ELEVENLABS_MODELE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Derniere version du depot (si la tache a attendu son tour)
        run: git pull -q --rebase
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer FFmpeg et les modules Python
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt faster-whisper
      - name: Modele de transcription (telecharge une seule fois)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Traiter les videos recues
        run: python -m src.main --videos
      - name: Garder la video 7 jours
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: sorties/
          retention-days: 7
          if-no-files-found: ignore
      - name: Memoriser les sujets et les archives
        run: |
          git config user.name "flash-monde"
          git config user.email "flash-monde@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Videos traitees"
          git pull -q --rebase --autostash && git push
      - name: Prevenir sur Telegram en cas d'echec
        if: failure()
        run: |
          [ -f sorties/.alerte ] && exit 0
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="⚠️ Flash Monde : le traitement vidéo a échoué. Journal : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
