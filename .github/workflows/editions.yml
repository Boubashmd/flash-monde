name: Flash Monde

# Heures en UTC. Videos vers 9h, 15h et 21h a Paris en heure d'hiver (UTC+1) ;
# en heure d'ete (UTC+2), tout sort une heure plus tard.
# Chaque edition a un creneau de rattrapage 20 min apres : GitHub saute parfois une tache
# planifiee. Le rattrapage ne fait rien si l'edition a deja tourne.
on:
  schedule:
    - cron: "45 7 * * *"
    - cron: "5 8 * * *"
    - cron: "45 13 * * *"
    - cron: "5 14 * * *"
    - cron: "45 19 * * *"
    - cron: "5 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

# une seule edition a la fois (les fichiers de data/ sont partages)
concurrency:
  group: flash-monde
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_MODELE: ${{ vars.ELEVENLABS_MODELE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Derniere version du depot (si la tache a attendu son tour)
        run: git pull -q --rebase
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer FFmpeg et les modules Python
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
      - name: Photos deja telechargees
        uses: actions/cache@v4
        with:
          path: |
            cache/images
            cache/portraits
          key: images-${{ github.run_id }}
          restore-keys: images-
      - name: Image satellite HD (NASA, telechargee une seule fois)
        uses: actions/cache@v4
        with:
          path: cache/terre
          key: terre-hd-v1
      - name: Fabriquer l'edition
        run: python -m src.main ${{ github.event_name == 'schedule' && '--si-pas-faite' || '' }}
      - name: Garder la video 7 jours
        uses: actions/upload-artifact@v4
        with:
          name: edition-${{ github.run_id }}
          path: sorties/
          retention-days: 7
          if-no-files-found: ignore
      - name: Memoriser les sujets et les archives
        run: |
          git config user.name "flash-monde"
          git config user.email "flash-monde@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Sujets traites"
          git pull -q --rebase --autostash && git push
      - name: Prevenir sur Telegram en cas d'echec
        if: failure()
        run: |
          [ -f sorties/.alerte ] && exit 0
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="⚠️ Flash Monde : l'édition a échoué. Journal : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
