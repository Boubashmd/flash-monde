# Flash Monde - configuration
# Les cles secretes ne vont PAS ici : elles vont dans le fichier .env (voir .env.example)

chaine:
  nom: "Flash Monde"      # affiche seulement sur la toute fin de la video, jamais lu
  fuseau: "Europe/Paris"

edition:
  nb_titres: 6            # nombre maximum d'infos par video (plus d'une minute : condition de remuneration TikTok)
  nb_developpes: 3        # les N premieres en 2-3 phrases, les suivantes en flash d'une phrase
  fenetre_heures: 8       # on ne regarde que les articles publies depuis X heures
  fenetre_matin_heures: 12  # le matin (avant midi, heure de Paris), on remonte plus loin : la nuit est calme
  min_sources: 2          # une info n'est retenue que si X medias differents en parlent
  oubli_heures: 36        # une info deja publiee n'est pas reprise pendant X heures...
  suites: true            # ...sauf comme « suite » s'il y a du nouveau (au moins min_sources medias)
  suite_apres_heures: 5   # delai minimum avant de proposer la suite d'une info
  # Ligne editoriale : les sujets de ces zones et de ces themes passent devant les autres.
  # Les noms de zones doivent exister dans src/pays.py.
  zones_prioritaires:
    - "États-Unis"
    - "Ukraine"
    - "Russie"
    - "Union européenne"
    - "France"
    - "Allemagne"
    - "Royaume-Uni"
    - "Italie"
    - "Pologne"
    - "Israël"
    - "Palestine"
    - "Iran"
    - "Liban"
    - "Syrie"
    - "Arabie saoudite"
    - "Turquie"
    - "Chine"
    - "Taïwan"
    - "Japon"
    - "Corée du Nord"
    - "Corée du Sud"
  themes_prioritaires:
    - "président"
    - "gouvernement"
    - "ministre"
    - "élection"
    - "parlement"
    - "congrès"
    - "sénat"
    - "sanction"
    - "sommet"
    - "diplomat"
    - "négociation"
    - "accord"
    - "cessez-le-feu"
    - "guerre"
    - "armée"
    - "bombard"
    - "missile"
    - "otan"
    - "droits de douane"
    - "tribunal"
    - "manifestation"
    - "émeute"
    - "pillage"
    - "violences urbaines"
    - "fusillade"
    - "attentat"
    - "attaque"
  # true : on ne garde QUE les sujets d'une zone prioritaire (moins de videos les jours calmes)
  zones_strictes: false
  # Les titres contenant un de ces mots sont ignores (formats qui ne sont pas des infos)
  exclure:
    - "en direct"
    - "l'info du jour"
    - "podcast"
    - "vidéo"
    - "revue de presse"
    - "horoscope"
    - "quiz"
    - "édito"
    - "tribune"
    - "chronique"
    # sport, loisirs et vie pratique (frequents dans les medias de proximite)
    - "ligue 1"
    - "ligue des champions"
    - "mercato"
    - "football"
    - "rugby"
    - "basket"
    - "handball"
    - "tennis"
    - "cyclisme"
    - "météo"
    - "loto"
    - "recette"
    - "bons plans"
    - "programme tv"

