# Flash Monde - configuration
# Les cles secretes ne vont PAS ici : elles vont dans le fichier .env (voir .env.example)

chaine:
  nom: "Flash Monde"      # affiche seulement sur la toute fin de la video, jamais lu
  fuseau: "Europe/Paris"

edition:
  nb_titres: 4            # nombre maximum d'infos par video
  fenetre_heures: 8       # on ne regarde que les articles publies depuis X heures
  fenetre_matin_heures: 12  # le matin (avant midi, heure de Paris), on remonte plus loin : la nuit est calme
  min_sources: 2          # une info n'est retenue que si X medias differents en parlent
  oubli_heures: 36        # une info deja publiee n'est pas reprise pendant X heures...
  suites: true            # ...sauf comme « suite » s'il y a du nouveau (au moins min_sources medias)
  suite_apres_heures: 5   # delai minimum avant de proposer la suite d'une info
  # Ligne editoriale : les sujets de ces zones et de ces themes passent devant les autres.
  # Les noms de zones doivent exister dans src/pays.py.
  zones_prioritaires:
    - "États-Unis"
    - "Ukraine"
    - "Russie"
    - "Union européenne"
    - "France"
    - "Allemagne"
    - "Royaume-Uni"
    - "Italie"
    - "Pologne"
    - "Israël"
    - "Palestine"
    - "Iran"
    - "Liban"
    - "Syrie"
    - "Arabie saoudite"
    - "Turquie"
    - "Chine"
    - "Taïwan"
    - "Japon"
    - "Corée du Nord"
    - "Corée du Sud"
  themes_prioritaires:
    - "président"
    - "gouvernement"
    - "ministre"
    - "élection"
    - "parlement"
    - "congrès"
    - "sénat"
    - "sanction"
    - "sommet"
    - "diplomat"
    - "négociation"
    - "accord"
    - "cessez-le-feu"
    - "guerre"
    - "armée"
    - "bombard"
    - "missile"
    - "otan"
    - "droits de douane"
    - "tribunal"
  # true : on ne garde QUE les sujets d'une zone prioritaire (moins de videos les jours calmes)
  zones_strictes: false
  # Les titres contenant un de ces mots sont ignores (formats qui ne sont pas des infos)
  exclure:
    - "en direct"
    - "l'info du jour"
    - "podcast"
    - "vidéo"
    - "revue de presse"
    - "horoscope"
    - "quiz"
    - "édito"
    - "tribune"
    - "chronique"

# Flux RSS. Desactive une source en mettant un # devant ses 2 lignes.
# Lance "python -m src.main --verifier-sources" pour voir lesquelles repondent.
sources:
  - nom: "Euronews"
    url: "https://fr.euronews.com/rss?level=theme&name=news"
  - nom: "France 24"
    url: "https://www.france24.com/fr/rss"
  - nom: "RFI"
    url: "https://www.rfi.fr/fr/rss"
  - nom: "Le Monde"
    url: "https://www.lemonde.fr/international/rss_full.xml"
  - nom: "franceinfo"
    url: "https://www.francetvinfo.fr/monde.rss"
  - nom: "Le Figaro"
    url: "https://www.lefigaro.fr/rss/figaro_international.xml"
  - nom: "Radio-Canada"
    url: "https://ici.radio-canada.ca/rss/5717"
  - nom: "ONU Info"
    url: "https://news.un.org/feed/subscribe/fr/news/all/rss.xml"
  - nom: "RTS"
    url: "https://www.rts.ch/info/monde/?format=rss/news"
  - nom: "20 Minutes"
    url: "https://www.20minutes.fr/feeds/rss-monde.xml"
  - nom: "BBC Afrique"
    url: "https://feeds.bbci.co.uk/afrique/rss.xml"
  - nom: "Courrier international"
    url: "https://www.courrierinternational.com/feed/all/rss.xml"
  - nom: "Jeune Afrique"
    url: "https://www.jeuneafrique.com/feed/"

validation:
  # Avant de fabriquer la voix et la video, le bot Telegram te propose les sujets :
  # tu gardes ou ecartes chacun, puis tu lances. Sans reponse, l'edition est abandonnee.
  active: true
  delai_minutes: 30

redaction:
  # "anthropic" : reformulation par Claude (recommande, necessite ANTHROPIC_API_KEY)
  # "extractif" : reprend le titre et le debut du resume d'une source. POUR TESTER SEULEMENT,
  #               ne publie pas ces videos : le texte n'est pas reformule.
  fournisseur: "anthropic"
  modele: "claude-haiku-4-5-20251001"

voix:
  # "azure" (Microsoft, gratuit jusqu'a 500 000 caracteres/mois) | "elevenlabs" (payant, naturel)
  # | "edge" (gratuit, correct) | "silence" (aucune voix, pour tester)
  # Si Azure ne repond pas, l'edition passe a ElevenLabs (s'il est configure), sinon a Edge.
  fournisseur: "azure"
  azure_voix: "fr-FR-RemyMultilingualNeural"
  azure_vitesse: "0%"     # "-10%" = plus pose, "+10%" = plus rapide
  elevenlabs_voice_id: "JBFqnCBsd6RMkjVDRZzb"
  # La voix et le modele se changent aussi sans toucher au code, dans GitHub :
  # Settings > Secrets and variables > Actions > onglet Variables : ELEVENLABS_VOICE_ID, ELEVENLABS_MODELE
  # "eleven_v4" : le plus naturel | "eleven_v3" : tres expressif | "eleven_multilingual_v2" : le plus regulier
  elevenlabs_modele: "eleven_v4"
  elevenlabs_modele_secours: ["eleven_v3", "eleven_multilingual_v2"]  # essayes si le premier echoue
  # Reglages de la voix ElevenLabs (entre 0 et 1, sauf la vitesse)
  reglages:
    stabilite: 0.5        # plus bas = plus expressif, plus haut = plus regulier (v3 : 0, 0.5 ou 1)
    similarite: 0.75      # fidelite au timbre de la voix choisie
    style: 0.1            # un peu d'intention, sans theatraliser
    vitesse: 1.0          # 0.9 = plus pose, 1.1 = plus rapide
  edge_voix: "fr-FR-HenriNeural"

images:
  # Le fond est toujours le globe satellite anime : la camera recule, tourne et zoome d'un pays a l'autre.
  # true : si l'info tourne autour d'une personnalite publique, son portrait libre (Wikimedia Commons)
  # s'affiche en encart au-dessus de la carte. Sans photo libre, la carte seule.
  portraits: true

semaine:
  # Le dimanche, « la semaine dans le monde » : les affaires qui ont marque les 7 derniers jours,
  # redigees a partir des breves deja publiees (workflow .github/workflows/semaine.yml)
  nb_titres: 5

publication:
  hashtags: 10              # hashtags de la legende (pays, personnalites, themes) ; YouTube en ignore au-dela de 15

youtube:
  # "bouton" : apres la video, Telegram te propose « Publier sur YouTube » (recommande)
  # "auto" : publication directe sans demander | "non" : jamais
  # Necessite les secrets YOUTUBE_CLIENT_ID, YOUTUBE_CLIENT_SECRET, YOUTUBE_REFRESH_TOKEN
  publication: "bouton"
  delai_minutes: 30         # sans reponse, la video n'est pas publiee
  confidentialite: "public" # "public" | "unlisted" (non repertoriee) | "private"

video:
  largeur: 1080
  hauteur: 1920
  fps: 30
  couleur_accent: "#FFD400"
  image_hd: true          # image satellite NASA 21600 px, telechargee une seule fois (cache/terre)
  son_transitions: true   # souffle discret pendant les deplacements de camera
  fin_marque: true        # fin silencieuse de 3 s : recul sur le globe et nom de la chaine
  musique: true           # musique de fond discrete : fichier libre depose dans assets/musique/, sinon composee
  volume_musique: 1.0     # 0.5 = deux fois plus discrete
